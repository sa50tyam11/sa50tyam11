<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" width="480" height="260" role="img" aria-label="Top languages">
<defs>
<clipPath id="langsClip"><rect width="480" height="260" rx="16"/></clipPath>
<linearGradient id="langsBg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a0b2e"/><stop offset="100%" stop-color="#2d0a4e"/></linearGradient>
</defs>
<style>
  text { font-family: 'Segoe UI', Verdana, Arial, sans-serif; }
  @keyframes growW { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes shimmer { 0%,100% { opacity: 0.85; } 50% { opacity: 1; } }
  .segbar { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); opacity: 0.85;
    animation: growW 1.2s cubic-bezier(.2,.7,.2,1) forwards, shimmer 2.4s ease-in-out infinite; }
  @keyframes slideIn { from { opacity:0; transform: translateX(-12px); } to { opacity:1; transform: translateX(0); } }
  .lrow { opacity: 0; animation: slideIn 0.5s ease forwards; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .fade { opacity: 0; animation: fadeIn 0.6s ease forwards; }
</style>
<g clip-path="url(#langsClip)">
<rect width="480" height="260" fill="url(#langsBg)"/>
<g opacity="0.06" stroke="#c9a8ef">
<line x1="0" y1="0" x2="0" y2="260"/>
<line x1="30" y1="0" x2="30" y2="260"/>
<line x1="60" y1="0" x2="60" y2="260"/>
<line x1="90" y1="0" x2="90" y2="260"/>
<line x1="120" y1="0" x2="120" y2="260"/>
<line x1="150" y1="0" x2="150" y2="260"/>
<line x1="180" y1="0" x2="180" y2="260"/>
<line x1="210" y1="0" x2="210" y2="260"/>
<line x1="240" y1="0" x2="240" y2="260"/>
<line x1="270" y1="0" x2="270" y2="260"/>
<line x1="300" y1="0" x2="300" y2="260"/>
<line x1="330" y1="0" x2="330" y2="260"/>
<line x1="360" y1="0" x2="360" y2="260"/>
<line x1="390" y1="0" x2="390" y2="260"/>
<line x1="420" y1="0" x2="420" y2="260"/>
<line x1="450" y1="0" x2="450" y2="260"/>
<line x1="480" y1="0" x2="480" y2="260"/>
</g>
<text x="20" y="32" font-size="17" font-weight="700" fill="#f3e9ff" class="fade" style="animation-delay:0.1s">Most Used Languages</text>
<rect x="20" y="48" width="440" height="18" rx="9" fill="#33184f"/>
<g clip-path="url(#langsClip)"><rect class="segbar" x="20.0" y="48" width="151.8" height="18" fill="#3178c6" style="animation-delay:0.30s, 1.50s"/></g>
<g clip-path="url(#langsClip)"><rect class="segbar" x="171.8" y="48" width="92.4" height="18" fill="#f1e05a" style="animation-delay:0.38s, 1.58s"/></g>
<g clip-path="url(#langsClip)"><rect class="segbar" x="264.2" y="48" width="63.8" height="18" fill="#3572A5" style="animation-delay:0.46s, 1.66s"/></g>
<g clip-path="url(#langsClip)"><rect class="segbar" x="328.0" y="48" width="52.8" height="18" fill="#e34c26" style="animation-delay:0.54s, 1.74s"/></g>
<g clip-path="url(#langsClip)"><rect class="segbar" x="380.8" y="48" width="39.6" height="18" fill="#dea584" style="animation-delay:0.62s, 1.82s"/></g>
<g clip-path="url(#langsClip)"><rect class="segbar" x="420.4" y="48" width="39.6" height="18" fill="#a45cff" style="animation-delay:0.70s, 1.90s"/></g>
<g class="lrow" style="animation-delay:0.60s">
  <circle cx="25" cy="95" r="5" fill="#3178c6"/>
  <text x="38" y="100" font-size="13" fill="#c9a8ef">TypeScript</text>
  <text x="226" y="100" font-size="12" text-anchor="end" font-weight="700" fill="#f3e9ff">34.5%</text>
</g>
