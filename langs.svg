  <text x="268" y="126" font-size="13" fill="#c9a8ef">Rust</text>
  <text x="456" y="126" font-size="12" text-anchor="end" font-weight="700" fill="#f3e9ff">9.0%</text>
</g>
<g class="lrow" style="animation-delay:1.10s">
  <circle cx="255" cy="147" r="5" fill="#a45cff"/>
  <text x="268" y="152" font-size="13" fill="#c9a8ef">Other</text>
  <text x="456" y="152" font-size="12" text-anchor="end" font-weight="700" fill="#f3e9ff">9.0%</text>
</g>
