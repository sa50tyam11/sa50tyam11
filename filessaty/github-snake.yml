name: Generate Contribution Snake

on:
  schedule:
    # Runs once a day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate the snake game from a GitHub user contribution graph
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=%23ff5fb0&color_dots=%2333184f,%23a45cff,%23ff5fb0,%23ffd166,%23f3e9ff
            dist/github-contribution-grid-snake-dark.gif?palette=github-dark&color_snake=%23ff5fb0&color_dots=%2333184f,%23a45cff,%23ff5fb0,%23ffd166,%23f3e9ff

      - name: Push snake output to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
