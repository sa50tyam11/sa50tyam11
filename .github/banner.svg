<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Satyam Kumar Jha</title>
  <desc id="d">Full-Stack Developer, founder of SENO Studio, open to SWE, Junior SWE and Frontend roles and internships.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0716"/>
      <stop offset="1" stop-color="#190a2c"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5fb0"/>
      <stop offset="0.55" stop-color="#a45cff"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.12" cy="0.1" r="0.55">
      <stop offset="0" stop-color="#a45cff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#a45cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.95" cy="1" r="0.5">
      <stop offset="0" stop-color="#ff5fb0" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ff5fb0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="24"/></clipPath>
    <style>
      .sans { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .line { animation: show 0.5s ease both; }
      .l1 { animation-delay: 0.3s; }
      .l2 { animation-delay: 0.8s; }
      .l3 { animation-delay: 1.3s; }
      .l4 { animation-delay: 1.8s; }
      .l5 { animation-delay: 2.3s; }
      .l6 { animation-delay: 2.8s; }
      .l7 { animation-delay: 3.3s; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .dot { animation: pulse 2s ease-in-out infinite; }
      @keyframes show { from { opacity: 0; } to { opacity: 1; } }
      @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      @media (prefers-reduced-motion: reduce) {
        .line, .cursor, .dot { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#glowA)"/>
    <rect width="1200" height="320" fill="url(#glowB)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <!-- Left: identity -->
    <text x="56" y="62" class="mono" font-size="18" fill="#ff5fb0">satyam@dev:~$ <tspan fill="#cdb8ff">cat README.md</tspan><tspan class="cursor" fill="#ff5fb0"> _</tspan></text>

    <text x="54" y="142" class="sans" font-size="64" font-weight="800" fill="url(#name)">Satyam Kumar Jha</text>

    <text x="56" y="188" class="sans" font-size="28" font-weight="600" fill="#f3e9ff">Full-Stack Developer</text>
    <text x="56" y="222" class="sans" font-size="19" fill="#b8a6e0">Founder of SENO Studio. Final-year BCA.</text>

    <rect x="56" y="244" width="548" height="40" rx="20" fill="#3ecf8e" fill-opacity="0.10" stroke="#3ecf8e" stroke-opacity="0.55"/>
    <circle class="dot" cx="80" cy="264" r="5" fill="#3ecf8e"/>
    <text x="96" y="270" class="sans" font-size="16" fill="#7ee7b4">Open to SWE, Junior SWE and Frontend roles and internships</text>

    <!-- Right: code panel -->
    <rect x="690" y="36" width="454" height="248" rx="16" fill="#120a22" stroke="#ffffff" stroke-opacity="0.10"/>
    <circle cx="716" cy="60" r="5.5" fill="#ff5f56"/>
    <circle cx="736" cy="60" r="5.5" fill="#ffbd2e"/>
    <circle cx="756" cy="60" r="5.5" fill="#27c93f"/>
    <text x="920" y="64" class="mono" font-size="12" fill="#7d6aa8" text-anchor="middle">profile.ts</text>

    <g class="mono" font-size="14.5">
      <text x="716" y="104" class="line l1"><tspan fill="#ff5fb0">const</tspan> <tspan fill="#f3e9ff">satyam</tspan> <tspan fill="#9f8fc9">=</tspan> <tspan fill="#9f8fc9">{</tspan></text>
      <text x="740" y="132" class="line l2"><tspan fill="#cdb8ff">role:</tspan> <tspan fill="#ffd166">"Full-Stack Developer"</tspan><tspan fill="#9f8fc9">,</tspan></text>
      <text x="740" y="160" class="line l3"><tspan fill="#cdb8ff">founder:</tspan> <tspan fill="#ffd166">"SENO Studio"</tspan><tspan fill="#9f8fc9">,</tspan></text>
      <text x="740" y="188" class="line l4"><tspan fill="#cdb8ff">stack:</tspan> <tspan fill="#9f8fc9">[</tspan><tspan fill="#ffd166">"Next.js"</tspan><tspan fill="#9f8fc9">,</tspan> <tspan fill="#ffd166">"TypeScript"</tspan><tspan fill="#9f8fc9">,</tspan> <tspan fill="#ffd166">"Supabase"</tspan><tspan fill="#9f8fc9">],</tspan></text>
      <text x="740" y="216" class="line l5"><tspan fill="#cdb8ff">delivered:</tspan> <tspan fill="#ffd166">"30 projects"</tspan><tspan fill="#9f8fc9">,</tspan></text>
      <text x="740" y="244" class="line l6"><tspan fill="#cdb8ff">building:</tspan> <tspan fill="#ffd166">"BANKAII (beta)"</tspan><tspan fill="#9f8fc9">,</tspan></text>
      <text x="716" y="270" class="line l7"><tspan fill="#9f8fc9">};</tspan></text>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
