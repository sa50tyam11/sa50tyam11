<svg xmlns="http://www.w3.org/2000/svg" width="480" height="520" viewBox="0 0 480 520" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Satyam Kumar Jha profile card</title>
  <desc id="d">A code-style card listing role, studio, stack, projects delivered, current build and open-to-work status.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0716"/>
      <stop offset="1" stop-color="#1c0b30"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.1" cy="0.05" r="0.7">
      <stop offset="0" stop-color="#a45cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#a45cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.95" cy="1" r="0.6">
      <stop offset="0" stop-color="#ff5fb0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff5fb0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="card"><rect width="480" height="520" rx="22"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .line { animation: show 0.5s ease both; }
      .l1 { animation-delay: 0.3s; } .l2 { animation-delay: 0.7s; } .l3 { animation-delay: 1.1s; }
      .l4 { animation-delay: 1.5s; } .l5 { animation-delay: 1.9s; } .l6 { animation-delay: 2.3s; }
      .l7 { animation-delay: 2.7s; } .l8 { animation-delay: 3.1s; } .l9 { animation-delay: 3.5s; }
      .l10 { animation-delay: 3.9s; }
      .dot { animation: pulse 2s ease-in-out infinite; }
      @keyframes show { from { opacity: 0; } to { opacity: 1; } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      @media (prefers-reduced-motion: reduce) { .line, .dot { animation: none; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="480" height="520" fill="url(#bg)"/>
    <rect width="480" height="520" fill="url(#glowA)"/>
    <rect width="480" height="520" fill="url(#glowB)"/>
    <rect width="480" height="520" fill="url(#grid)"/>

    <rect x="24" y="24" width="432" height="472" rx="16" fill="#120a22" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.10"/>
    <circle cx="50" cy="52" r="6" fill="#ff5f56"/>
    <circle cx="71" cy="52" r="6" fill="#ffbd2e"/>
    <circle cx="92" cy="52" r="6" fill="#27c93f"/>
    <text x="240" y="56" class="mono" font-size="13" fill="#7d6aa8" text-anchor="middle">profile.ts</text>

    <g class="mono" font-size="15.5">
      <text x="50" y="112" class="line l1"><tspan fill="#ff5fb0">const</tspan> <tspan fill="#f3e9ff">satyam</tspan> <tspan fill="#9f8fc9">=</tspan> <tspan fill="#9f8fc9">{</tspan></text>
      <text x="76" y="146" class="line l2"><tspan fill="#cdb8ff">role:</tspan> <tspan fill="#ffd166">"Full-Stack Developer"</tspan><tspan fill="#9f8fc9">,</tspan></text>
      <text x="76" y="180" class="line l3"><tspan fill="#cdb8ff">founder:</tspan> <tspan fill="#ffd166">"SENO Studio"</tspan><tspan fill="#9f8fc9">,</tspan></text>
      <text x="76" y="214" class="line l4"><tspan fill="#cdb8ff">frontend:</tspan> <tspan fill="#9f8fc9">[</tspan><tspan fill="#ffd166">"Next.js"</tspan><tspan fill="#9f8fc9">,</tspan> <tspan fill="#ffd166">"React"</tspan><tspan fill="#9f8fc9">],</tspan></text>
      <text x="76" y="248" class="line l5"><tspan fill="#cdb8ff">backend:</tspan> <tspan fill="#9f8fc9">[</tspan><tspan fill="#ffd166">"Node.js"</tspan><tspan fill="#9f8fc9">,</tspan> <tspan fill="#ffd166">"Supabase"</tspan><tspan fill="#9f8fc9">],</tspan></text>
      <text x="76" y="282" class="line l6"><tspan fill="#cdb8ff">mobile:</tspan> <tspan fill="#ffd166">"Flutter"</tspan><tspan fill="#9f8fc9">,</tspan></text>
      <text x="76" y="316" class="line l7"><tspan fill="#cdb8ff">delivered:</tspan> <tspan fill="#ffd166">"30 projects"</tspan><tspan fill="#9f8fc9">,</tspan></text>
      <text x="76" y="350" class="line l8"><tspan fill="#cdb8ff">building:</tspan> <tspan fill="#ffd166">"BANKAII (beta)"</tspan><tspan fill="#9f8fc9">,</tspan></text>
      <text x="76" y="384" class="line l9"><tspan fill="#cdb8ff">openTo:</tspan> <tspan fill="#9f8fc9">[</tspan><tspan fill="#ffd166">"SWE"</tspan><tspan fill="#9f8fc9">,</tspan> <tspan fill="#ffd166">"Frontend"</tspan><tspan fill="#9f8fc9">],</tspan></text>
      <text x="50" y="418" class="line l10"><tspan fill="#9f8fc9">};</tspan></text>
    </g>

    <rect x="50" y="448" width="250" height="30" rx="15" fill="#3ecf8e" fill-opacity="0.10" stroke="#3ecf8e" stroke-opacity="0.55"/>
    <circle class="dot" cx="70" cy="463" r="4.5" fill="#3ecf8e"/>
    <text x="84" y="468" class="sans" font-size="13.5" fill="#7ee7b4">Open to work</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
