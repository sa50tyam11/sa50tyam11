<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 200" width="820" height="200" role="img" aria-label="Trophies">
<defs>
<clipPath id="trophClip"><rect width="820" height="200" rx="16"/></clipPath>
<linearGradient id="trophBg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1a0b2e"/><stop offset="100%" stop-color="#2d0a4e"/></linearGradient>
<linearGradient id="rankGradS" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ffd166"/><stop offset="100%" stop-color="#ff9f1c"/></linearGradient>
<linearGradient id="rankGradA" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ff5fb0"/><stop offset="100%" stop-color="#c23fe0"/></linearGradient>
<linearGradient id="rankGradB" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#7fd6ff"/><stop offset="100%" stop-color="#5f9dff"/></linearGradient>
<linearGradient id="cellShine" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ffffff" stop-opacity="0"/><stop offset="45%" stop-color="#ffffff" stop-opacity="0"/><stop offset="50%" stop-color="#ffffff" stop-opacity="0.4"/><stop offset="55%" stop-color="#ffffff" stop-opacity="0"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
<filter id="trophGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
  text { font-family: 'Segoe UI', Verdana, Arial, sans-serif; }
  @keyframes popCell {
    0%   { opacity: 0; transform: scale(0.6) translateY(14px); }
    65%  { opacity: 1; transform: scale(1.06) translateY(-3px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }
  .cell { opacity: 0; transform-box: fill-box; transform-origin: center; animation: popCell 0.6s cubic-bezier(.2,.8,.3,1.3) forwards; }
  @keyframes glowPulse { 0%,100% { filter: drop-shadow(0 0 2px currentColor); } 50% { filter: drop-shadow(0 0 6px currentColor); } }
  .rankGlow { animation: glowPulse 2.2s ease-in-out infinite; }
  @keyframes shineSweep {
    0%   { transform: translate(-140px,-160px) rotate(20deg); }
    100% { transform: translate(140px,160px) rotate(20deg); }
  }
  .cellShine { animation: shineSweep 3.2s ease-in-out infinite; }
</style>
